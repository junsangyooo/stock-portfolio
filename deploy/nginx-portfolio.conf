# /etc/nginx/sites-available/portfolio
# portfolio.jsyoo.dev + quant.jsyoo.dev → reverse proxy to FastAPI on :8888
# Auth: 6-digit account PIN, enforced by the app (session cookie)
#
# One block serves both names: the app routes on the Host header (quant.* gets
# the auto-trading cockpit, everything else the portfolio landing). Session
# cookies carry no Domain attribute, so each host keeps its own — logging into
# portfolio does not unlock the order book.

server {
    listen 80;
    server_name portfolio.jsyoo.dev quant.jsyoo.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portfolio.jsyoo.dev quant.jsyoo.dev;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # No Basic Auth: the app gates every /api/* route on the account PIN
    # session cookie (src/dashboard_web/server.py). A second HTTP-level 401
    # would also wipe the browser's credential cache on each app 403.

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy to FastAPI
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
