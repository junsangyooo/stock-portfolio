# /etc/nginx/sites-available/portfolio
# portfolio.jsyoo.dev → reverse proxy to this app's FastAPI on :8888 (dashboard.service).
# Auth: 6-digit account PIN, enforced by the app (session cookie).
# quant.jsyoo.dev is the new quant (autotrade, :8890) in deploy/nginx-quant.conf, not here.
#
# Applying a change (by hand — deploy.sh only warns when this file and the server's differ):
#   sudo cp /etc/nginx/sites-available/portfolio /etc/nginx/sites-available/portfolio.bak-$(date +%F)
#   sudo cp ~/portfolio-dashboard/deploy/nginx-portfolio.conf /etc/nginx/sites-available/portfolio
#   sudo nginx -t && sudo systemctl reload nginx
# Checks:
#   from the laptop, through Cloudflare (HSTS present, 'server: cloudflare', 200):
#     curl -sI https://portfolio.jsyoo.dev/ | grep -i -e '^HTTP' -e strict-transport -e '^server'
#   on the server (the server itself is allowed: 127.0.0.1 in the geo block):
#     curl -sk -o /dev/null -w '%{http_code}\n' --resolve portfolio.jsyoo.dev:443:127.0.0.1 https://portfolio.jsyoo.dev/api/accounts   -> 200
#   from the laptop, straight to the origin (not Cloudflare → closed without an answer):
#     curl -sk -o /dev/null -w '%{http_code}\n' --resolve portfolio.jsyoo.dev:443:<server-ip> https://portfolio.jsyoo.dev/   -> 000
#   Undo: restore portfolio.bak-<date>, nginx -t, reload.
#
# Cloudflare ranges (https://www.cloudflare.com/ips-v4/ and /ips-v6/) are the same list as in
# deploy/nginx-quant.conf (fetched 2026-10-09); tests/test_deploy_nginx.py checks the two files
# agree. Refresh both when Cloudflare changes them: a missing range turns those edges' visitors
# away. No real_ip here: the PIN lockout is per account (src/portfolio/security.py), not per
# address, so the app has no use for the visitor's address.

# Who may reach this origin: Cloudflare's edges, and the server itself for its own checks.
# $realip_remote_addr is the address that opened the connection. Top level of this file = the
# http block, so the variable name must differ from nginx-quant.conf's ($quant_via_cloudflare).
geo $realip_remote_addr $portfolio_via_cloudflare {
    default 0;
    127.0.0.1 1;
    ::1 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    server_name portfolio.jsyoo.dev;
    server_tokens off;
    if ($portfolio_via_cloudflare = 0) {
        return 444;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portfolio.jsyoo.dev;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Not Cloudflare (someone who found the origin's address): close without an answer.
    if ($portfolio_via_cloudflare = 0) {
        return 444;
    }

    # No Basic Auth: the app gates every /api/* route on the account PIN
    # session cookie (src/dashboard_web/server.py). A second HTTP-level 401
    # would also wipe the browser's credential cache on each app 403.

    # HSTS for this name only: no includeSubDomains (other *.jsyoo.dev sites decide for
    # themselves), no preload. A year; browsers then never try plain http for this name.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # security headers (the CSP comes from the app, per response)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy to FastAPI
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
