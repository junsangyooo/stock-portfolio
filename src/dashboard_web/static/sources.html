<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>portfolio · 소스 현황</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* SCR-SOURCES · PNL-SOURCE (디자인 인계 §8, Figma 31:167476). Tokens come
   from theme.json (server-injected); shared.css carries the font, the .btn
   family, chip, segment, card, table, top bar, bottom tab and the side panel.
   Mobile-first: everything stacks on phones; 600px is the 1440 chrome and a
   default-size segment; 900px puts the right column beside the source list;
   1100px lays the sources out as a table. */
a { color:inherit; }

/* ── page head: title, meta, view switch, pipeline line ── */
.page-head { margin-bottom:var(--space-gap-lg); }
.ph-top { display:flex; flex-direction:column; gap:var(--space-gap-md); }
.ph-title { display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--space-gap-xs) var(--space-gap-md); }
/* 390: the top bar shows the title, so the h1 stays for screen readers only */
.ph-h1 { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.ph-meta { color:var(--text-muted); font-size:var(--type-caption-size); display:flex; flex-wrap:wrap;
           gap:var(--space-gap-xs) var(--space-gap-sm); align-items:center; }
.ph-tools { display:flex; align-items:center; gap:var(--space-gap-sm); }
.run-chip { color:var(--accent-default); border-color:var(--accent-default); }
.run-chip .lci { color:var(--accent-default); }
.pipe { color:var(--text-muted); font-size:var(--type-caption-size); display:flex; flex-wrap:wrap;
        align-items:center; gap:var(--space-gap-xs) var(--space-gap-sm); }
.pipe b { color:var(--text-primary); font-weight:var(--type-body-style); }
.pipe .lci { width:var(--icon-size-sm); height:var(--icon-size-sm); color:var(--text-muted); }
.poll-err { color:var(--status-error); }
.view-seg { flex:1; }
.ph-meta .sk { flex:0 0 280px; max-width:100%; margin:0; }
.ph-meta:has(.sk) { flex:1 1 280px; }
.btn.reload { border:none; background:transparent; color:var(--text-muted); font-size:var(--type-caption-size); }
.btn.reload:hover { background:var(--bg-default); color:var(--text-primary); }

/* ── cards ── */
.card { margin-bottom:var(--space-gap-lg); }
.card h2 { display:flex; align-items:baseline; gap:var(--space-gap-sm); flex-wrap:wrap; }
.card h2 small { color:var(--text-muted); font-size:var(--type-caption-size); font-weight:var(--type-body-style); }
.sub { color:var(--text-muted); font-size:var(--type-caption-size); margin-top:var(--space-gap-xs); }
.foot { color:var(--text-muted); font-size:var(--type-caption-size); margin-top:var(--space-gap-md); }

/* status colour: one class per state, read through --st */
.st-ok { --st:var(--status-success); }
.st-collect_error, .st-flaky, .st-quiet, .st-late { --st:var(--status-warning); }
.st-failing, .st-problem { --st:var(--status-error); }
.st-never, .st-none { --st:var(--text-muted); }
.st-running { --st:var(--accent-default); }
.st-ico { color:var(--st); }
.stat { display:inline-flex; align-items:center; gap:var(--space-gap-xs); white-space:nowrap; }
.stat .lci { width:var(--icon-size-sm); height:var(--icon-size-sm); color:var(--st); }
.chip .lci { color:var(--st); }

/* ── 확인할 것 ── */
.check-empty { display:flex; align-items:center; gap:var(--space-gap-sm); flex-wrap:wrap; }
.check-empty h2 .lci { color:var(--status-success); }
.ck-table { width:100%; border-collapse:collapse; margin-top:var(--space-gap-sm); }
.ck-table thead { display:none; }
.ck-table tbody { display:block; }
.ck-table tr { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-gap-xs) var(--space-gap-sm);
               padding:var(--space-gap-md) 0; border-top:var(--border-width) solid var(--border-default); }
.ck-table td { display:block; }
.ck-table td.k-name { flex:1 1 0; min-width:0; }
.ck-table td.k-sit, .ck-table td.k-why, .ck-table td.k-do { flex-basis:100%; }
.ck-table td.k-sit { font-size:var(--type-caption-size); }
.ck-table td.k-why { color:var(--text-muted); font-size:var(--type-caption-size); overflow-wrap:anywhere; }
.ck-table td.k-do { font-size:var(--type-caption-size); }
.ck-table td.k-do .lbl { color:var(--text-muted); margin-right:var(--space-gap-xs); }
.ck-table td:empty { display:none; }

/* ── right column: one card of folded rows on phones, three cards from 900px ── */
.side { background:var(--bg-default); border-radius:var(--radius-card); margin-bottom:var(--space-gap-lg);
        padding:0 var(--space-card-compact); }
.side > details { padding:var(--space-gap-md) 0; }
.side > details + details { border-top:var(--border-width) solid var(--border-default); }
.side details > summary { list-style:none; cursor:pointer; display:grid;
  grid-template-columns:auto 1fr auto; gap:0 var(--space-gap-sm); align-items:center; }
.side details > summary::-webkit-details-marker { display:none; }
.side summary h2 { font-size:var(--type-body-size); font-weight:var(--type-body-style); }
.side summary .sub { grid-column:2; margin-top:0; }
.side summary .chev { grid-row:1 / span 2; grid-column:3; color:var(--text-muted); transition:transform var(--motion-fast); }
.side summary > .st-ico { grid-row:1 / span 2; }
.side details[open] summary .chev { transform:rotate(180deg); }
.acc-body { margin-top:var(--space-gap-md); }
.ops-line { display:flex; align-items:center; gap:var(--space-gap-sm); padding:var(--space-gap-xs) 0; }
.ops-line .lci { color:var(--st); }
.ops-line small { color:var(--text-muted); font-size:var(--type-body-size); }

.th-table { width:100%; border-collapse:collapse; margin-top:var(--space-gap-sm); }
.th-table th { color:var(--text-muted); font-weight:var(--type-body-style); font-size:var(--type-caption-size);
               text-align:left; padding:var(--space-gap-2xs) 0; }
.th-table th.r, .th-table td.r { text-align:right; }
.th-table td { padding:var(--space-gap-xs) 0; font-size:var(--type-caption-size); }
.th-table td.r { font-size:var(--type-body-size); font-weight:var(--type-number-style); padding-left:var(--space-gap-md); }
.th-table td.nm { display:flex; align-items:center; gap:var(--space-gap-xs); }
.th-table td.nm .lci { width:var(--icon-size-sm); height:var(--icon-size-sm); color:var(--text-muted); }
.th-table .short { color:var(--status-warning); }
.th-table .chip { margin-left:auto; padding:0 var(--space-gap-xs); --st:var(--status-warning); }
.uncl-stats { display:flex; gap:var(--space-section); flex-wrap:wrap; }
.uncl-stats .k { color:var(--text-muted); font-size:var(--type-caption-size); }
.uncl-stats .v { font-size:var(--type-number-size); font-weight:var(--type-number-style); }
.uncl-ex { margin-top:var(--space-gap-md); font-size:var(--type-caption-size); color:var(--text-muted); }
.uncl-ex ul { margin:var(--space-gap-xs) 0 0; padding:0; }
.uncl-ex li { list-style:none; padding:var(--space-gap-2xs) 0; color:var(--text-primary); overflow-wrap:anywhere; }
.uncl-ex li small { color:var(--text-muted); margin-left:var(--space-gap-xs); }
.uncl-do { margin-top:var(--space-gap-md); font-size:var(--type-caption-size); }
.uncl-do .lbl { color:var(--text-muted); margin-right:var(--space-gap-sm); }

/* ── source list: rows on phones, a table from 1100px ── */
.src-table { width:100%; border-collapse:collapse; margin-top:var(--space-gap-sm); }
.src-table thead { display:none; }
.src-table tbody { display:block; }
.src-table tr.grp { display:block; }
.src-table tr.grp th { display:block; text-align:left; font-weight:var(--type-body-style); color:var(--text-primary);
                       font-size:var(--type-caption-size); padding:var(--space-gap-md) 0 var(--space-gap-xs); }
.src-table tr.grp th small { color:var(--text-muted); font-size:var(--type-caption-size); margin-left:var(--space-gap-sm); }
.src-table tr.src { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-gap-2xs) var(--space-gap-sm);
                    padding:var(--space-gap-sm) 0; border-top:var(--border-width) solid var(--border-default); cursor:pointer; }
.src-table tr.src:hover { background:var(--bg-subtle); }
.src-table td { display:block; }
.src-table td.c-name { flex:1 1 0; min-width:0; }
.src-table td.c-brk { flex-basis:100%; height:0; }
.src-table td.c-st { font-size:var(--type-caption-size); }
.src-table td.c-runs, .src-table td.c-new, .src-table td.c-filt,
.src-table td.c-imp, .src-table td.c-unt, .src-table td.c-note { font-size:var(--type-caption-size); color:var(--text-muted); }
.src-table.v-today td.c-runs, .src-table.v-today td.c-imp, .src-table.v-today td.c-unt,
.src-table.v-week td.c-filt, .src-table.v-week td.c-unt { display:none; }
.src-table td.c-note:empty { display:none; }
.src-table.v-today td.c-filt::before, .src-table.v-week td.c-imp::before,
.src-table td.c-note::before { content:'· '; }
.src-table .t-d { display:none; }
.src-table td.c-imp.dimmed { color:var(--text-muted); }
.only-wide { display:none; }
#src-legend-top .legend { margin-top:var(--space-gap-sm); }
.btn.src-btn {
  border:none; background:transparent; padding:0; min-height:24px; color:var(--text-primary);
  justify-content:flex-start; max-width:100%;
}
.btn.src-btn:hover { background:transparent; text-decoration:underline; }
.src-btn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.btn.th-btn { border:none; background:transparent; min-height:0; padding:0 var(--space-gap-2xs); color:var(--text-muted); gap:var(--space-gap-2xs); }
.btn.th-btn .lci { width:var(--icon-size-sm); height:var(--icon-size-sm); }
.th-none { color:var(--text-muted); }
.fail-n { color:var(--status-error); margin-left:var(--space-gap-xs); }
.notes { display:inline-flex; flex-wrap:wrap; gap:var(--space-gap-2xs) var(--space-gap-sm); align-items:center; }
.note { display:inline-flex; align-items:center; gap:var(--space-gap-xs); color:var(--text-primary); }
.note.dim { color:var(--text-muted); }
.note .lci { width:var(--icon-size-sm); height:var(--icon-size-sm); color:var(--status-warning); }
.note.review .lci { color:var(--accent-default); }

/* collection strip: one cell per sweep */
.strip { display:inline-flex; gap:var(--space-gap-2xs); vertical-align:middle; }
.strip i { display:inline-block; width:7px; height:12px; border-radius:var(--space-gap-2xs);
           border:var(--border-width) solid var(--chart-price); }
.strip i.has { background:var(--chart-price); }
.strip i.zero { border-color:var(--border-default); }
.strip i.nil { border:var(--border-width) dashed var(--border-default); }
.strip i.fail, .dot.fail {
  border-color:var(--status-error);
  background:
    linear-gradient(45deg, transparent 42%, var(--status-error) 42% 58%, transparent 58%),
    linear-gradient(-45deg, transparent 42%, var(--status-error) 42% 58%, transparent 58%);
}
.legend { display:flex; flex-wrap:wrap; gap:var(--space-gap-xs) var(--space-gap-md); align-items:center;
          color:var(--text-muted); font-size:var(--type-caption-size); }
.legend span { display:inline-flex; align-items:center; gap:var(--space-gap-xs); }
.today-runs { display:inline-flex; gap:var(--space-gap-sm); align-items:center; white-space:nowrap; }
.today-runs span { display:inline-flex; align-items:center; gap:var(--space-gap-2xs); }
.dot { display:inline-block; width:8px; height:8px; border-radius:var(--radius-chip);
       background:var(--chart-price); border:var(--border-width) solid var(--chart-price); }
.dot.plan { background:transparent; border:var(--border-width) dashed var(--text-muted); }
.today-runs .plan-t { color:var(--text-muted); }

/* ── states ── */
.sk { margin:var(--space-gap-sm) 0; }
.sk.w30 { width:30%; } .sk.w45 { width:45%; } .sk.w60 { width:60%; } .sk.w100 { width:100%; }
.sk.h { height:18px; }
.side.sk-side { padding:var(--space-card-compact); }
#skeleton .sk-side { display:none; }
.state-err { text-align:center; padding:var(--space-page) var(--space-gap-lg); }
.state-err .big { color:var(--status-error); width:24px; height:24px; }
.state-err h2 { justify-content:center; margin:var(--space-gap-sm) 0; }
.state-err p { color:var(--text-muted); margin-bottom:var(--space-gap-xs); }
.state-err .btn { margin-top:var(--space-gap-md); }
.gate { text-align:center; padding:var(--space-page) var(--space-gap-md); color:var(--text-muted); }
.gate a { color:var(--accent-default); text-decoration:underline; }

/* ── field name bubble ── */
.tip {
  position:absolute; z-index:var(--z-panel); background:var(--bg-inverse); color:var(--text-inverse);
  border-radius:var(--radius-control); padding:var(--space-gap-xs) var(--space-gap-sm);
  font-size:var(--type-caption-size);
}
.tip div { display:flex; align-items:center; gap:var(--space-gap-xs); padding:var(--space-gap-2xs) 0; }
.tip .lci { width:var(--icon-size-sm); height:var(--icon-size-sm); }

/* ── detail panel — S.panel; the page fills its head and body ── */
.dp-head-ico { display:inline-flex; gap:var(--space-gap-2xs); color:var(--text-muted); }
.dp-todo { background:var(--bg-subtle); border-radius:var(--radius-control);
           padding:var(--space-gap-md) var(--space-gap-lg); }
.dp-todo .lbl { color:var(--text-muted); margin-right:var(--space-gap-sm); }
.dp-sec h3 { font-size:var(--type-heading-2-size); line-height:var(--type-heading-2-line-height);
             margin-bottom:var(--space-gap-sm); }
.dp-sec p { font-size:var(--type-caption-size); }
.dp-sec .sub { margin-bottom:var(--space-gap-sm); }
.big-strip { display:grid; grid-template-columns:repeat(14, 1fr); gap:var(--space-gap-xs); }
.big-strip i { display:block; height:22px; border-radius:var(--radius-cell); border:var(--border-width) solid var(--chart-price); }
.big-strip i.has { background:var(--chart-price); }
.big-strip i.zero { border-color:var(--border-default); }
.big-strip i.nil { border:var(--border-width) dashed var(--border-default); }
.big-strip i.fail {
  border-color:var(--status-error);
  background:
    linear-gradient(45deg, transparent 46%, var(--status-error) 46% 54%, transparent 54%),
    linear-gradient(-45deg, transparent 46%, var(--status-error) 46% 54%, transparent 54%);
}
.ends { display:flex; justify-content:space-between; color:var(--text-muted); font-size:var(--type-caption-size);
        margin:var(--space-gap-xs) 0; }
.dp-nums { display:grid; grid-template-columns:repeat(4, 1fr); gap:var(--space-gap-sm); }
.dp-nums .k { color:var(--text-muted); font-size:var(--type-caption-size); }
.dp-nums .v { font-size:var(--type-number-size); font-weight:var(--type-number-style); }
.bars { display:flex; align-items:flex-end; gap:var(--space-gap-2xs); height:48px;
        border-bottom:var(--border-width) solid var(--border-default); }
.bars i { flex:1; background:var(--chart-price); min-height:1px; }
.bars i.zero { background:var(--border-default); }
.dist { width:100%; border-collapse:collapse; font-size:var(--type-caption-size); }
.dist td { padding:var(--space-gap-xs) 0; }
.dist td.nm { white-space:nowrap; padding-right:var(--space-gap-md); }
.dist td.nm .lci { width:var(--icon-size-sm); height:var(--icon-size-sm); color:var(--text-muted); margin-right:var(--space-gap-xs); }
.dist td.bar { width:50%; }
.dist .track { height:8px; border-radius:var(--radius-chip); background:var(--bg-subtle); overflow:hidden; }
.dist .track i { display:block; height:100%; background:var(--accent-default); }
.dist td.r { text-align:right; font-size:var(--type-number-sm-size); font-weight:var(--type-number-sm-style);
             padding-left:var(--space-gap-md); }
.err-list { margin:0; padding:0; }
.err-list li { list-style:none; font-size:var(--type-caption-size); padding:var(--space-gap-2xs) 0; overflow-wrap:anywhere; }
.err-list li small { color:var(--text-muted); margin-right:var(--space-gap-sm); }
.dp-url { font-size:var(--type-caption-size); overflow-wrap:anywhere; color:var(--accent-default); }

@media (min-width: 600px) {
  .ph-h1 { position:static; width:auto; height:auto; overflow:visible; clip:auto; white-space:normal; }
  .ph-top { flex-direction:row; justify-content:space-between; align-items:center; }
  .view-seg { flex:none; }
  .view-seg.seg-lg { min-height:0; border-color:transparent; }
  .view-seg.seg-lg > button { padding:var(--space-gap-xs) var(--space-control-x); font-size:var(--type-caption-size); }
}
@media (min-width: 900px) {
  .layout { display:grid; grid-template-columns:minmax(0, 1fr) 360px; gap:0 var(--space-gap-lg);
            grid-template-areas:"check check" "srcs side"; align-items:start; }
  .layout > .check { grid-area:check; }
  .layout > .side { grid-area:side; }
  .layout > .srcs { grid-area:srcs; }
  .side { background:none; padding:0; }
  #skeleton .sk-side { display:block; background:var(--bg-default); padding:var(--space-card); }
  .side > details { background:var(--bg-default); border-radius:var(--radius-card);
                    padding:var(--space-card); margin-bottom:var(--space-gap-lg); }
  .side > details + details { border-top:none; }
  .ck-table thead { display:table-header-group; }
  .ck-table tbody { display:table-row-group; }
  .ck-table tr { display:table-row; }
  .ck-table td, .ck-table td:empty { display:table-cell; padding:var(--space-gap-sm) var(--space-gap-sm) var(--space-gap-sm) 0;
                                     border-top:var(--border-width) solid var(--border-default); vertical-align:middle; }
  .ck-table td.k-name { font-size:var(--type-body-size); }
  .ck-table th { text-align:left; font-weight:var(--type-body-style); color:var(--text-muted); font-size:var(--type-caption-size);
                 padding:var(--space-gap-xs) var(--space-gap-sm) var(--space-gap-xs) 0; }
  .ck-table td.k-do .lbl { display:none; }
  .side details > summary { cursor:default; display:block; }
  .side summary .sub, .side summary .chev, .side summary > .st-ico { display:none; }
  .side summary h2 { font-size:var(--type-heading-2-size); font-weight:var(--type-heading-2-style); }
  .side .acc-ops > summary { display:none; }
  .side .acc-ops .acc-body { margin-top:0; }
}
@media (min-width: 1100px) {
  .src-table thead { display:table-header-group; }
  .src-table tbody { display:table-row-group; }
  .src-table tr.src, .src-table tr.grp { display:table-row; }
  .src-table tr.grp th { display:table-cell; }
  .src-table th { text-align:left; font-weight:var(--type-body-style); color:var(--text-muted); font-size:var(--type-caption-size);
                  padding:var(--space-gap-xs); vertical-align:bottom; line-height:var(--type-caption-line-height); }
  .src-table th.r { text-align:right; }
  .src-table td, .src-table td.c-note:empty,
  .src-table.v-today td.c-runs, .src-table.v-today td.c-imp, .src-table.v-today td.c-unt,
  .src-table.v-week td.c-filt, .src-table.v-week td.c-unt { display:table-cell; padding:var(--space-gap-2xs) var(--space-gap-xs); vertical-align:middle; }
  .src-table td.c-brk { display:none; }
  .src-table tr.src { border-top:none; }
  .src-table td.c-name { max-width:140px; }
  .btn.src-btn { font-size:var(--type-caption-size); }
  .src-table td.c-new, .src-table td.c-filt, .src-table td.c-imp, .src-table td.c-unt { text-align:right; color:var(--text-primary); white-space:nowrap; }
  .src-table td.c-new { font-size:var(--type-number-sm-size); font-weight:var(--type-number-sm-style); }
  .src-table td.c-imp.dimmed { color:var(--text-muted); }
  .src-table.v-today td.c-filt::before, .src-table.v-week td.c-imp::before,
  .src-table td.c-note::before { content:none; }
  .src-table .t-m { display:none; }
  .src-table .t-d { display:inline; }
  .only-wide { display:block; }
  .only-narrow { display:none; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<main id="main" class="page" aria-busy="true">
  <div class="page-head">
    <div class="ph-top">
      <div class="ph-title">
        <h1 class="ph-h1">소스 현황</h1>
        <p class="ph-meta" id="ph-meta"><span class="sk w100"></span></p>
      </div>
      <div class="ph-tools">
        <div class="seg seg-lg view-seg" id="view-seg" role="group" aria-label="보기 기간">
          <button type="button" data-view="today" class="active" aria-pressed="true">오늘</button>
          <button type="button" data-view="week" aria-pressed="false">최근 7일</button>
        </div>
        <button id="btn-reload" type="button" class="btn reload sm-up"><svg class="lci" aria-hidden="true"><use href="#i-refresh-cw"/></svg> 새로고침</button>
      </div>
    </div>
    <p class="pipe" id="pipe"></p>
    <p class="pipe poll-err" id="poll-err" role="status" hidden></p>
  </div>

  <div class="card gate" id="gate" hidden>

<script>
const { el, clear, svgIco } = S;
const TOKENS = window.__THEME_TOKENS || { themes: {} };

// ── vocabulary ──────────────────────────────────────────────────────
const SRC_STATUS = {
  collect_error: '수집 오류', failing: '실패 중', flaky: '자주 실패',
  quiet: '새 글 없음', never: '다음 수집 때 확인', ok: '정상',
};
const SRC_ACTION = {
  collect_error: '수정 배포 뒤 다음 수집 때 확인',
  failing: '오류가 이어지면 주소 점검',
  flaky: '다른 주소를 찾거나 소스에서 빼기',
  quiet: '피드 주소가 맞는지 확인',
  never: '다음 수집 결과 확인',
};
const SRC_ICON = {
  collect_error: 'triangle-alert', failing: 'circle-x', flaky: 'activity',
  quiet: 'info', never: 'circle-dashed', ok: 'circle-check',
};
const CHECK_ORDER = ['collect_error', 'failing', 'quiet', 'flaky', 'never'];
const GROUPS = [['news', '뉴스'], ['research', '논문'], ['social', '커뮤니티']];
const RESEARCH_NOTE = '논문은 뉴스보다 앞서 나오는 자료라 중요한 글로 견주지 않아요';
const REVIEW_NOTE = '빼도 될지 검토: 최근 30일 글이 20건 이상인데 중요한 글이 7% 이하이고, '
  + '같은 분야를 주로 다루는 소스가 3곳 이상일 때 한 곳에 붙어요. 자동으로 빠지지는 않아요.';
const JOB_KO = {
  news: '뉴스 수집·정리', backup: 'DB 백업', fundamental: '재무', etf: 'ETF',
  snapshot: '종가 기록', screener: 'KRX 스크리너', universe: '종목 목록', analysis: '종합 분석',
};
const JOB_STATUS = { problem: '오류', late: '늦음', none: '기록 없음' };
const FACTS = [['bars', '일봉'], ['quotes', '시세'], ['valuation', '밸류에이션'],
               ['sector', '업종'], ['etf', 'ETF']];
const SLOTS = [6, 17];          // KST hours of the two scheduled collections
const POLL_MS = 5 * 60 * 1000;
const WEEKDAY = ['일', '월', '화', '수', '목', '금', '토'];

let DATA = null;
let VIEW = 'today';
let LAST_OK = null;            // when the page last loaded the report
let OPEN = null;               // source_id shown in the detail panel

// ── chrome: top bar (수집 area) + bottom tab; 390 keeps 새로고침 in the bar ──
S.chrome({
  topBar: { active: 'news', title: '소스 현황', actions: [el('button', {
    type: 'button', className: 'btn tb-act', onClick: () => load() }, [svgIco('refresh-cw'), S.LABELS.refresh])] },
  bottomTab: 'news',
});

// ── format ──────────────────────────────────────────────────────────
function n(v) { return v == null ? '—' : Number(v).toLocaleString('ko-KR'); }
function pct(a, b) { return b ? Math.round(a / b * 100) + '%' : '—'; }
// ISO with any offset → its wall clock in KST, as a Date read through getUTC*
function kst(iso) { const t = new Date(iso).getTime(); return isNaN(t) ? null : new Date(t + 9 * 3600e3); }
function pad(v) { return String(v).padStart(2, '0'); }
function md(iso) {
  if (!iso) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso.slice(5, 7) + '/' + iso.slice(8, 10);
  const d = kst(iso); return d ? pad(d.getUTCMonth() + 1) + '/' + pad(d.getUTCDate()) : '';
}
function hm(iso) { const d = kst(iso); return d ? pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) : ''; }
function mdhm(iso) { return iso ? md(iso) + ' ' + hm(iso) : ''; }
function kstDay(iso) { const d = kst(iso); return d ? d.toISOString().slice(0, 10) : ''; }
function weekday(iso) { const d = kst(iso); return d ? WEEKDAY[d.getUTCDay()] + '요일' : ''; }
function short(s, max) { s = String(s || ''); return s.length > max ? s.slice(0, max - 1) + '…' : s; }

// scheduled collection times around `iso`: the last one passed and the next
function slots(iso) {
  const d = kst(iso), now = new Date(iso).getTime(), out = [];
  for (let off = -1; off <= 1; off++) {
    for (const h of SLOTS) {
      out.push(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + off, h) - 9 * 3600e3);
    }
  }
  const prev = out.filter(t => t <= now).pop(), next = out.find(t => t > now);
  return { prev: new Date(prev).toISOString(), next: new Date(next).toISOString() };
}

// ── themes: icon from theme.json, name from the report or theme.json ──
let THEME_NAME = {};
function themeName(id) {
  return THEME_NAME[id] || id;
}
function themeIco(id) {
  const i = svgIco(S.newsThemeIcon(id));
  i.setAttribute('aria-hidden', 'true');
  return i;
}
function themeButton(ids) {
  if (!ids.length) return el('span', { className: 'th-none', 'aria-label': '주로 다루는 분야 없음' }, ['—']);
  const names = ids.map(themeName).join(', ');
  return el('button', {
    type: 'button', className: 'btn th-btn', title: names, 'aria-label': '주로 다루는 분야: ' + names,
    onClick: e => { e.stopPropagation(); showTip(e.currentTarget, ids); },
  }, ids.map(themeIco));
}
const tip = document.getElementById('tip');
function showTip(anchor, ids) {
  if (!tip.hidden && tip.dataset.for === ids.join()) { hideTip(); return; }
  clear(tip);
  ids.forEach(id => tip.appendChild(el('div', {}, [themeIco(id), themeName(id)])));
  tip.dataset.for = ids.join();
  tip.hidden = false;
  const r = anchor.getBoundingClientRect();
  const left = Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8);
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = (window.scrollY + r.bottom + 4) + 'px';
}
function hideTip() { tip.hidden = true; tip.dataset.for = ''; }
document.addEventListener('click', e => { if (!tip.hidden && !e.target.closest('.th-btn')) hideTip(); });

// ── small builders ──────────────────────────────────────────────────
function stat(status, text) {
  return el('span', { className: 'stat st-' + status }, [svgIco(SRC_ICON[status] || 'info'), text]);
}
function chip(status, icon, text) {
  return el('span', { className: 'chip st-' + status }, [svgIco(icon), text]);
}
function strip(runs, big) {
  const counts = { has: 0, zero: 0, fail: 0, nil: 0 };
  const cells = runs.map(r => {
    const k = !r ? 'nil' : !r.ok ? 'fail' : r.written ? 'has' : 'zero';
    counts[k]++;
    const t = !r ? '기록 없음' : mdhm(r.at) + (r.ok ? ' · 새 글 ' + r.written + '건' : ' · 실패 · ' + short(r.error, 80));
    return el('i', { className: k, title: t });
  });
  return el('span', {
    className: big ? 'big-strip' : 'strip', role: 'img',
    'aria-label': '최근 ' + runs.length + '번 수집: 새 글 있음 ' + counts.has + '번, 새 글 0건 '
      + counts.zero + '번, 실패 ' + counts.fail + '번, 기록 없음 ' + counts.nil + '번',
  }, cells);
}
function legend() {
  return el('div', { className: 'legend' }, [
    el('span', {}, [el('span', { className: 'strip' }, [el('i', { className: 'has' })]), '새 글 있음']),
    el('span', {}, [el('span', { className: 'strip' }, [el('i', { className: 'zero' })]), '새 글 0건']),
    el('span', {}, [el('span', { className: 'strip' }, [el('i', { className: 'fail' })]), '실패']),
    el('span', {}, [el('span', { className: 'strip' }, [el('i', { className: 'nil' })]), '기록 없음']),
  ]);
}

// today's collections for one source: done ones as dots, the rest as planned
function todayRuns(s) {
  const d = DATA, out = [], seen = new Set();
  d.news.runs.forEach((at, i) => {
    if (kstDay(at) !== d.news.today) return;
    const r = s.runs[i], h = kst(at).getUTCHours();
    seen.add(h < 12 ? 6 : 17);
    const cls = !r ? 'dot plan' : r.ok ? 'dot' : 'dot fail';
    const t = !r ? '기록 없음' : r.ok ? '새 글 ' + r.written + '건' : '실패 · ' + short(r.error, 80);
    out.push(el('span', { title: t }, [el('i', { className: cls }), hm(at)]));
  });
  const now = new Date(d.asof).getTime();
  SLOTS.forEach(h => {
    if (seen.has(h)) return;
    const at = Date.UTC(+d.news.today.slice(0, 4), +d.news.today.slice(5, 7) - 1, +d.news.today.slice(8, 10), h) - 9 * 3600e3;
    out.push(el('span', { className: 'plan-t' }, [el('i', { className: 'dot plan' }),
      pad(h) + ':00' + (at > now ? ' 예정' : '')]));
  });
  return el('span', { className: 'today-runs' }, out);
}

function notes(s) {
  const out = [];
  s.flags.filter(f => f.kind === 'only').forEach(f =>
    out.push(el('span', { className: 'note', title: themeName(f.theme) }, [themeIco(f.theme), '이 분야 하나뿐'])));
  s.flags.filter(f => f.kind === 'review').forEach(f =>
    out.push(el('span', { className: 'note review', title: themeName(f.theme) },
      [svgIco('info'), '빼도 될지 검토 · 빼면 ' + f.from + '곳 → ' + f.to + '곳'])));
  if (s.week.outside > 0) out.push(el('span', { className: 'note dim' }, ['정기 수집 밖 ' + n(s.week.outside) + '건']));
  if (s.flags.some(f => f.kind === 'rare')) out.push(el('span', { className: 'note dim' }, ['글이 적어 판단 보류']));
  return out;
}

// ── runs analysis ───────────────────────────────────────────────────
// Consecutive failures among the shown collections, with the collection that
// ended each (null while it is still going).
function streaks(runs) {
  const out = [];
  let cur = null;
  runs.forEach(r => {
    if (r && !r.ok) {
      if (!cur) { cur = { from: r.at, to: r.at, k: 0, next: null }; out.push(cur); }
      cur.to = r.at; cur.k++;
    } else if (cur) {
      if (r) cur.next = r;
      cur = null;
    }
  });
  return out;
}
function situation(s) {
  const seen = s.runs.filter(Boolean), fails = seen.filter(r => !r.ok).length;
  if (s.status === 'collect_error' || s.status === 'quiet') {
    return s.last_item_on ? md(s.last_item_on) + '부터 새 글 0건' : '받은 글 없음';
  }
  if (s.status === 'never') return '수집 기록 없음';
  const parts = ['최근 ' + seen.length + '번 중 ' + fails + '번 실패'];
  const st = streaks(s.runs), last = st[st.length - 1];
  if (last && last.next) parts.push(mdhm(last.next.at) + '부터 다시 받음');
  else if (last) parts.push(mdhm(last.from) + '부터 실패 중');
  return parts.join(' · ');
}
function lastError(s) {
  if (s.last_error) return s.last_error;
  const f = s.runs.filter(r => r && !r.ok && r.error).pop();
  return f ? f.error : '';
}

// ── 확인할 것 ───────────────────────────────────────────────────────
function checkItems(d) {
  const items = [];
  const news = d.jobs.find(j => j.job === 'news');
  if (news && news.status === 'late') {
    items.push({ kind: 'job', name: '정기 수집', st: 'late', icon: 'triangle-alert', label: '수집 늦음',
      sit: '수집이 예정(' + hm(slots(d.asof).prev) + ')보다 늦어요'
        + (d.news.runs.length ? ' · 마지막 수집 ' + mdhm(d.news.runs[d.news.runs.length - 1]) : ''),
      why: news.problems.join(' · '), todo: '' });
  }
  d.news.sources.filter(s => s.status !== 'ok')
    .sort((a, b) => CHECK_ORDER.indexOf(a.status) - CHECK_ORDER.indexOf(b.status))
    .forEach(s => {
      const why = [s.status === 'flaky' || s.status === 'failing' ? '' : s.reason, short(lastError(s), 90)]
        .filter(Boolean).join(' · ');
      items.push({ kind: 'source', sid: s.source_id, name: S.srcName(s.source_id), st: s.status,
        icon: SRC_ICON[s.status], label: SRC_STATUS[s.status], sit: situation(s), why,
        todo: SRC_ACTION[s.status] || '' });
    });
  d.jobs.filter(j => ['problem', 'late', 'none'].includes(j.status) && !(j.job === 'news' && j.status === 'late'))
    .forEach(j => items.push({ kind: 'job', name: JOB_KO[j.job] || j.job, st: j.status,
      icon: j.status === 'none' ? 'circle-dashed' : j.status === 'late' ? 'triangle-alert' : 'circle-x',
      label: JOB_STATUS[j.status],
      sit: j.status === 'none' ? '실행 기록이 없어요'
        : (j.status === 'late' ? '예정보다 늦어요 · ' : '') + (j.written_at ? '마지막 실행 ' + mdhm(j.written_at) : '실행 시각 모름'),
      why: j.problems.join(' · '), todo: '작업 기록 확인' }));
  marketIssues(d).forEach(m => items.push(Object.assign({ kind: 'market' }, m)));
  return items;
}
function marketIssues(d) {
  const m = d.market, out = [], sit = [];
  FACTS.forEach(([k, label]) => {
    const f = m[k] || {};
    if (f.missing) sit.push(f.missing + '종목 ' + label + ' 없음');
    if (f.late) sit.push(f.late + '종목 ' + label + ' 늦음');
  });
  if (sit.length) {
    out.push({ name: '시세·재무', st: sit.some(t => t.endsWith('없음')) ? 'problem' : 'late',
      icon: 'triangle-alert', label: sit.some(t => t.endsWith('없음')) ? '없음' : '늦음',
      sit: sit.join(' · '), why: '', todo: '계좌 화면에서 확인' });
  }
  const sc = m.screener || {};
  if (sc.date == null || sc.age_days > 4) {
    out.push({ name: 'KRX 스크리너', st: sc.date == null ? 'problem' : 'late', icon: 'triangle-alert',
      label: sc.date == null ? '없음' : '늦음',
      sit: sc.date == null ? '자료가 없어요' : sc.age_days + '일 전 자료예요', why: '', todo: '작업 기록 확인' });
  }
  const u = d.universe, age = Math.max(u.kr_age_h || 0, u.us_age_h || 0);
  if (!u.total || age > 26) {
    out.push({ name: '종목 목록', st: !u.total ? 'problem' : 'late', icon: 'triangle-alert',
      label: !u.total ? '없음' : '늦음',
      sit: !u.total ? '목록이 비어 있어요' : Math.round(age) + '시간 전 목록이에요', why: '', todo: '작업 기록 확인' });
  }
  return out;
}

function renderCheck(d, items) {
  const sec = document.getElementById('sec-check');
  clear(sec);
  const nSrc = items.filter(i => i.kind === 'source').length;
  const sum = d.news.sources.length;
  if (!items.length) {
    sec.appendChild(el('div', { className: 'check-empty' }, [
      el('h2', { id: 'check-h' }, [svgIco('circle-check'), '지금 확인할 것이 없어요']),
      el('span', { className: 'sub' }, ['최근 수집 ' + (mdhm(d.news.runs[d.news.runs.length - 1]) || '—')
        + ' · ' + sum + '곳 정상']),
    ]));
    return;
  }
  const parts = [];
  const nJob = items.filter(i => i.kind === 'job').length, nMkt = items.filter(i => i.kind === 'market').length;
  if (nJob) parts.push('정기 작업 ' + nJob);
  if (nMkt) parts.push('시세·재무 ' + nMkt);
  if (nSrc) parts.push('소스 ' + nSrc + '곳');
  sec.appendChild(el('h2', { id: 'check-h' }, ['확인할 것', el('small', {}, [parts.join(' · ')])]));
  const body = el('tbody');
  items.forEach(it => {
    const name = it.kind === 'source'
      ? el('button', { type: 'button', className: 'btn src-btn', onClick: () => openPanel(it.sid) },
          [el('span', {}, [it.name])])
      : it.name;
    body.appendChild(el('tr', {}, [
      el('td', { className: 'k-name' }, [name]),
      el('td', { className: 'k-st' }, [chip(it.st, it.icon, it.label)]),
      el('td', { className: 'k-sit' }, [it.sit]),
      el('td', { className: 'k-why' }, it.why ? [it.why] : []),
      el('td', { className: 'k-do' }, it.todo ? [el('span', { className: 'lbl' }, ['할 일']), it.todo] : []),
    ]));
  });
  sec.appendChild(el('table', { className: 'ck-table' }, [
    el('thead', {}, [el('tr', {}, ['소스', '상태', '상황', '이유', '할 일']
      .map(h => el('th', { scope: 'col' }, [h])))]),
    body,
  ]));
}

// ── page head ───────────────────────────────────────────────────────
function renderHead(d, items) {
  const meta = document.getElementById('ph-meta');
  clear(meta);
  const runs = d.news.runs, sl = slots(d.asof);
  const nSrc = items.filter(i => i.kind === 'source').length;
  const unit = items.length === nSrc ? '곳' : '건';
  meta.appendChild(el('span', {}, [
    '최근 수집 ' + (runs.length ? mdhm(runs[runs.length - 1]) : '—')
    + ' · 다음 수집 ' + mdhm(sl.next) + ' · 확인할 것 ' + items.length + unit]));
  const news = d.jobs.find(j => j.job === 'news');
  const p = d.pipeline;
  if (news && news.status === 'running') {
    meta.appendChild(el('span', { className: 'chip run-chip' }, [S.spinner(),
      '수집 중 · 요약 ' + n(p.enriched_today) + '/' + n(p.collected_today) + '건']));
  }
  const pipe = document.getElementById('pipe');
  clear(pipe);
  const arrow = () => svgIco('chevron-right');
  const summed = p.enriched_today < p.collected_today
    ? n(p.enriched_today) + '/' + n(p.collected_today) + '건' : n(p.enriched_today) + '건';
  const daily = p.daily_date !== d.news.today ? '분야별 정리 전'
    : p.daily_themes >= p.n_themes ? '분야별 정리 ' + p.n_themes + '분야 모두'
    : '분야별 정리 ' + p.daily_themes + '/' + p.n_themes + '분야';
  [el('span', {}, ['오늘 수집 ', el('b', {}, [n(p.collected_today) + '건'])]), arrow(),
   el('span', {}, ['요약 ', el('b', {}, [summed])]), arrow(),
   el('span', {}, [el('b', {}, [daily])]),
   p.weekly_start ? el('span', {}, ['· 주간 정리 · ' + md(p.weekly_start) + ' 주'
     + (p.weekly_built_at ? '(' + md(p.weekly_built_at) + ' ' + weekday(p.weekly_built_at) + ' 실행)' : '')]) : null,
  ].forEach(x => { if (x) pipe.appendChild(x); });
}

// ── right column ────────────────────────────────────────────────────
function renderSide(d) {
  // jobs and market facts
  const jobs = d.jobs, bad = jobs.filter(j => !['ok', 'running'].includes(j.status)).length;
  const running = jobs.filter(j => j.status === 'running').length;
  const mkt = marketIssues(d).length;
  const jobsText = bad ? '정기 작업 ' + jobs.length + '개 중 ' + bad + '개 확인'
    : '정기 작업 ' + jobs.length + '개 모두 정상' + (running ? ' · ' + running + '개 실행 중' : '');
  const mktText = mkt ? '시세·재무 ' + mkt + '건 확인' : '시세·재무 정상';
  const ok = !bad && !mkt;
  const ico = document.getElementById('ops-ico');
  ico.setAttribute('class', 'lci st-ico st-' + (ok ? 'ok' : 'late'));
  ico.firstElementChild.setAttribute('href', '#i-' + (ok ? 'circle-check' : 'triangle-alert'));
  document.getElementById('ops-sub').textContent = jobsText + ' · ' + mktText;
  const ob = document.getElementById('ops-body');
  clear(ob);
  ob.appendChild(el('div', { className: 'ops-line st-' + (bad ? 'late' : 'ok') },
    [svgIco(bad ? 'triangle-alert' : 'circle-check'), jobsText]));
  ob.appendChild(el('div', { className: 'ops-line st-' + (mkt ? 'late' : 'ok') },
    [svgIco(mkt ? 'triangle-alert' : 'circle-check'), mktText,
     el('small', {}, ['· 보유 ' + n(d.market.held) + '종목 기준'])]));

  // themes
  const themes = d.news.themes.slice().sort((a, b) => b.n30 - a.n30);
  const short1 = themes.filter(t => t.main_sources.length <= 1).length;
  const tIco = document.getElementById('themes-ico');
  tIco.setAttribute('class', 'lci st-ico st-' + (short1 ? 'flaky' : 'ok'));
  tIco.firstElementChild.setAttribute('href', '#i-' + (short1 ? 'triangle-alert' : 'circle-check'));
  document.getElementById('themes-sub').textContent = themes.length + '분야'
    + (short1 ? ' · 소스 부족 ' + short1 + '분야' : '');
  const tb = document.getElementById('themes-body');
  clear(tb);
  tb.appendChild(el('p', { className: 'sub' }, ['글 하나에 분야가 여럿 붙을 수 있어요']));
  tb.appendChild(el('table', { className: 'th-table' }, [
    el('thead', {}, [el('tr', {}, [el('th', { scope: 'col' }, ['분야']),
      el('th', { scope: 'col', className: 'r' }, ['30일 글']),
      el('th', { scope: 'col', className: 'r' }, ['주로 다루는 소스'])])]),
    el('tbody', {}, themes.map(t => {
      const few = t.main_sources.length <= 1;
      return el('tr', {}, [
        el('td', { className: 'nm' }, [themeIco(t.theme_id), themeName(t.theme_id),
          few ? chip('flaky', 'triangle-alert', '소스 부족') : null]),
        el('td', { className: 'r num' }, [n(t.n30)]),
        el('td', { className: 'r num' + (few ? ' short' : ''),
                   title: t.main_sources.map(S.srcName).join(', ') }, [t.main_sources.length + '곳']),
      ]);
    })),
  ]));
  if (short1) tb.appendChild(el('p', { className: 'foot' }, ['소스 부족: 주로 다루는 소스가 0~1곳이에요']));

  // what fell outside the fields
  const u = d.news.unclassified;
  document.getElementById('uncl-sub').textContent = '키워드로 거른 글 ' + n(u.filtered) + '건 · 분야 없는 글 '
    + n(u.untagged) + '건';
  const ub = document.getElementById('uncl-body');
  clear(ub);
  ub.appendChild(el('div', { className: 'uncl-stats' }, [
    el('div', {}, [el('div', { className: 'k' }, ['키워드로 거른 글']),
      el('div', { className: 'v num' }, [n(u.filtered) + '건']),
      el('div', { className: 'k' }, ['최근 ' + d.news.runs.length + '번 수집'])]),
    el('div', {}, [el('div', { className: 'k' }, ['분야 없는 글']),
      el('div', { className: 'v num' }, [n(u.untagged) + '건 · ' + pct(u.untagged, u.enriched)]),
      el('div', { className: 'k' }, ['최근 7일'])]),
  ]));
  if (u.examples.length) {
    ub.appendChild(el('div', { className: 'uncl-ex' }, ['예시 제목',
      el('ul', {}, u.examples.map(x => el('li', {}, [x.title, el('small', {}, [S.srcName(x.source_id)])])))]));
  }
  ub.appendChild(el('p', { className: 'uncl-do' }, [el('span', { className: 'lbl' }, ['할 일']), '분야 목록 고치기']));
}

// the right column folds on phones and stays open from 900px
const WIDE = window.matchMedia('(min-width: 900px)');
function syncSide() {
  document.querySelectorAll('.side details').forEach(dt => { dt.open = WIDE.matches; });
}
document.querySelectorAll('.side summary').forEach(sm =>
  sm.addEventListener('click', e => { if (WIDE.matches) e.preventDefault(); }));
WIDE.addEventListener('change', syncSide);

// ── source list ─────────────────────────────────────────────────────
function rank(s) {
  if (s.status !== 'ok') return CHECK_ORDER.indexOf(s.status);
  return s.flags.some(f => f.kind === 'review') ? 10 : 20;
}
function srcRow(s) {
  const today = VIEW === 'today', c = today ? s.today : s.week;
  const research = s.group === 'research';
  const unsorted = today && !s.today.enriched;
  const filt = s.broad && (c.written + c.filtered)
    ? [n(c.filtered), el('span', { className: 't-d' }, [' (' + pct(c.filtered, c.written + c.filtered) + ')'])]
    : [n(c.filtered)];
  const imp = unsorted ? ['—'] : [el('span', { className: 't-m' }, ['중요한 글 ']), n(c.important),
    el('span', { className: 't-m' }, ['건']),
    c.enriched ? el('span', { className: 't-d' }, [' (' + pct(c.important, c.enriched) + ')']) : null];
  const runs = today ? todayRuns(s) : el('span', {}, [strip(s.runs),
    s.week.failed ? el('span', { className: 'fail-n t-m' }, ['실패 ' + s.week.failed + '번']) : null]);
  const tr = el('tr', { className: 'src', dataset: { sid: s.source_id } }, [
    el('td', { className: 'c-name' }, [el('button', {
      type: 'button', className: 'btn src-btn', title: S.srcName(s.source_id),
      'aria-haspopup': 'dialog' }, [el('span', {}, [S.srcName(s.source_id)])])]),
    el('td', { className: 'c-th' }, [themeButton(s.themes.main)]),
    el('td', { className: 'c-st' }, [stat(s.status, SRC_STATUS[s.status])]),
    el('td', { className: 'c-brk', 'aria-hidden': 'true' }),
    el('td', { className: 'c-runs' }, [runs]),
    el('td', { className: 'c-new num' }, [el('span', { className: 't-m' }, [today ? '새 글 ' : '7일 글 ']),
      n(c.written), el('span', { className: 't-m' }, ['건'])]),
    el('td', { className: 'c-filt num' }, [el('span', { className: 't-m' }, ['거른 글 '])].concat(filt,
      [el('span', { className: 't-m' }, ['건'])])),
    el('td', { className: 'c-imp num' + (research ? ' dimmed' : '') }, imp),
    el('td', { className: 'c-unt num' }, [unsorted ? '—' : n(c.untagged)]),
    el('td', { className: 'c-note' }, notes(s).length ? [el('span', { className: 'notes' }, notes(s))] : []),
  ]);
  tr.addEventListener('click', e => { if (!e.target.closest('.th-btn')) openPanel(s.source_id); });
  return tr;
}

function renderSources(d) {
  const today = VIEW === 'today';
  const table = document.getElementById('src-table');
  table.className = 'src-table v-' + VIEW;
  const srcs = d.news.sources;
  document.getElementById('src-n').textContent = srcs.length + '곳';
  const runs = d.news.runs, todays = runs.filter(at => kstDay(at) === d.news.today);
  const sumW = srcs.reduce((a, s) => a + (today ? s.today : s.week).written, 0);
  const sumF = srcs.reduce((a, s) => a + (today ? s.today : s.week).filtered, 0);
  document.getElementById('src-sub').textContent = today
    ? '오늘 ' + md(d.news.today) + ' ' + (todays.length ? todays.map(hm).join('·') + ' 수집' : '수집 전')
      + ' · 새 글 ' + n(sumW) + '건 · 키워드로 거른 글 ' + n(sumF) + '건 · 중요한 글 = 중요도 5점 중 4점 이상'
    : '최근 ' + runs.length + '번 수집' + (runs.length ? '(' + mdhm(runs[0]) + '~' + mdhm(runs[runs.length - 1]) + ')' : '')
      + ' · 새 글 ' + n(sumW) + '건 · 중요한 글 = 중요도 5점 중 4점 이상';
  const top = document.getElementById('src-legend-top');
  clear(top);
  top.className = 'only-narrow';
  if (!today) top.appendChild(legend());
  const body = document.getElementById('src-body');
  clear(body);
  GROUPS.forEach(([g, label]) => {
    const rows = srcs.filter(s => s.group === g)
      .sort((a, b) => rank(a) - rank(b) || b.week.written - a.week.written);
    if (!rows.length) return;
    body.appendChild(el('tr', { className: 'grp' }, [el('th', { colspan: '9', scope: 'colgroup' }, [
      label + ' ' + rows.length + '곳', g === 'research' ? el('small', {}, [RESEARCH_NOTE]) : null])]));
    rows.forEach(s => body.appendChild(srcRow(s)));
  });
  const foot = document.getElementById('src-foot');
  clear(foot);
  if (today) foot.appendChild(el('p', {}, ['중요한 글·분야 없음은 오늘 들어온 글의 정리가 끝나면 채워져요']));
  else foot.appendChild(el('div', { className: 'only-wide' }, [legend()]));
  if (srcs.some(s => s.flags.some(f => f.kind === 'review'))) foot.appendChild(el('p', {}, [REVIEW_NOTE]));
}

// ── detail panel ────────────────────────────────────────────────────
// S.panel: right 420–480 from 600px, a full sheet below it. It traps focus,
// closes on Esc and on a click outside — except on another source, which
// swaps the panel's content instead.
const dp = S.panel({ keepOpenOn: 'tr.src, .ck-table .src-btn', onClose: () => {
  const was = OPEN;
  OPEN = null;
  // the row the panel was opened from may have been redrawn by a poll
  const at = document.activeElement;
  if (was && (!at || at === document.body || dp.el.contains(at))) {
    const row = document.querySelector('tr.src[data-sid="' + CSS.escape(was) + '"] .src-btn');
    if (row) row.focus();
  }
} });
function openPanel(sid) {
  OPEN = sid;
  hideTip();
  renderPanel();
  dp.open();
}
function closePanel() { dp.close(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !tip.hidden) hideTip();
});

function section(title, kids) { return el('section', { className: 'dp-sec' }, [el('h3', {}, [title])].concat(kids)); }

function renderPanel() {
  const s = DATA && DATA.news.sources.find(x => x.source_id === OPEN);
  if (!s) { closePanel(); return; }
  const name = S.srcName(s.source_id);
  dp.titleEl.textContent = name;
  clear(dp.head);
  dp.head.appendChild(el('span', { className: 'dp-head-ico', title: s.themes.main.map(themeName).join(', ') },
    s.themes.main.map(themeIco)));
  dp.head.appendChild(chip(s.status, SRC_ICON[s.status], SRC_STATUS[s.status]));
  clear(dp.body);
  const dpBody = dp.body;
  if (SRC_ACTION[s.status]) {
    dpBody.appendChild(el('div', { className: 'dp-todo' }, [el('span', { className: 'lbl' }, ['할 일']), SRC_ACTION[s.status]]));
  }
  // flaky/failing reasons repeat the strip's own count below
  if (s.reason && !['flaky', 'failing'].includes(s.status)) dpBody.appendChild(el('p', { className: 'sub' }, [s.reason]));

  // the last collections
  const seen = s.runs.filter(Boolean), fails = seen.filter(r => !r.ok).length;
  const runAts = DATA.news.runs;
  dpBody.appendChild(section('최근 ' + s.runs.length + '번 수집', [
    strip(s.runs, true),
    el('div', { className: 'ends' }, [el('span', {}, [mdhm(runAts[0])]), el('span', {}, [mdhm(runAts[runAts.length - 1])])]),
    el('p', {}, [fails ? seen.length + '번 중 ' + fails + '번 실패' : seen.length + '번 모두 받음']),
  ]));

  // four numbers
  const usual = s.d30.usual_per_day;
  dpBody.appendChild(section('글 수', [el('div', { className: 'dp-nums' }, [
    ['오늘', n(s.today.collected) + '건'], ['7일', n(s.week.collected) + '건'],
    ['30일', n(s.d30.n) + '건'], ['평소 하루', usual == null ? '—' : '약 ' + usual + '건'],
  ].map(([k, v]) => el('div', {}, [el('div', { className: 'k' }, [k]), el('div', { className: 'v num' }, [v])])))]));

  // 30 days
  const daily = s.d30.daily, max = Math.max(1, ...daily), days = DATA.news.days;
  dpBody.appendChild(section('30일 하루 글 수', [
    el('div', { className: 'bars', role: 'img',
      'aria-label': '최근 ' + daily.length + '일 하루 글 수, 합계 ' + n(s.d30.n) + '건' },
      daily.map((v, i) => el('i', { className: v ? '' : 'zero', title: md(days[i]) + ' · ' + v + '건',
        style: v ? 'height:' + Math.max(4, Math.round(v / max * 100)) + '%' : '' }))),
    el('div', { className: 'ends' }, [el('span', {}, [md(days[0])]), el('span', {}, [md(days[days.length - 1])])]),
  ]));

  // gaps
  const st = streaks(s.runs);
  if (st.length) {
    const lines = [];
    st.forEach(g => {
      lines.push(el('p', {}, [g.next
        ? mdhm(g.from) + (g.k > 1 ? ' ~ ' + mdhm(g.to) : '') + ' · ' + g.k + '번 실패'
        : mdhm(g.from) + '부터 ' + g.k + '번 연속 실패 중이에요']));
      if (g.next && usual != null && g.next.written > usual) {
        lines.push(el('p', {}, [mdhm(g.next.at) + '에 다시 받을 때 ' + n(g.next.written) + '건이 들어왔어요. 평소 하루 약 '
          + usual + '건이라 그 사이 글을 놓쳤을 수 있어요.']));
      }
    });
    dpBody.appendChild(section('끊긴 기간', lines));
  }

  // raw errors
  const errs = new Map();
  s.runs.forEach(r => { if (r && !r.ok && r.error) errs.set(r.error, { at: r.at, k: ((errs.get(r.error) || {}).k || 0) + 1 }); });
  if (s.last_error && !errs.has(s.last_error)) errs.set(s.last_error, { at: null, k: 0 });
  if (errs.size) {
    dpBody.appendChild(section('오류 원문', [el('ul', { className: 'err-list' }, [...errs].map(([e, v]) =>
      el('li', {}, [el('small', {}, [(v.at ? '마지막 ' + mdhm(v.at) : '최근 기록') + (v.k ? ' · ' + v.k + '번' : '')]), e])))]));
  }

  // field distribution
  if (s.themes.dist.length) {
    dpBody.appendChild(section('분야 분포 상위 ' + s.themes.dist.length + '개', [
      el('p', { className: 'sub' }, ['최근 30일 · 글 하나에 분야가 여럿 붙을 수 있어 합이 100%를 넘어요']),
      el('table', { className: 'dist' }, [el('tbody', {}, s.themes.dist.map(([t, share]) => el('tr', {}, [
        el('td', { className: 'nm' }, [themeIco(t), themeName(t)]),
        el('td', { className: 'bar' }, [el('div', { className: 'track' },
          [el('i', { style: 'width:' + Math.min(100, Math.round(share * 1000) / 10) + '%' })])]),
        el('td', { className: 'r num' }, [(share * 100).toFixed(1) + '%']),
      ])))]),
    ]));
  }

  if (s.url) {
    dpBody.appendChild(section('피드 주소', [el('a', { className: 'dp-url', href: s.url, target: '_blank',
      rel: 'noopener noreferrer' }, [s.url])]));
  }
}

// ── view switch ─────────────────────────────────────────────────────
document.querySelectorAll('#view-seg button').forEach(b => b.addEventListener('click', () => {
  VIEW = b.dataset.view;
  document.querySelectorAll('#view-seg button').forEach(x => {
    x.classList.toggle('active', x === b);
    x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
  });
  if (DATA) renderSources(DATA);
}));

// ── load ────────────────────────────────────────────────────────────
const main = document.getElementById('main');
function show(which) {
  document.getElementById('skeleton').hidden = which !== 'loading';
  document.getElementById('content').hidden = which !== 'data';
  document.getElementById('err').hidden = which !== 'error';
  document.getElementById('gate').hidden = which !== 'gate';
  ['ph-meta', 'view-seg', 'pipe'].forEach(id => {
    document.getElementById(id).hidden = which === 'error' || which === 'gate';
  });
  main.setAttribute('aria-busy', which === 'loading' ? 'true' : 'false');
}
S.onForbidden = () => show('gate');

async function load() {
  let d;
  try { d = await S.api('/api/health/sources', { toast: false }); }   // the page says it inline
  catch (e) {
    if (e && e.message === 'PIN required') return;   // the gate is already open
    const code = /HTTP (\d+)/.exec(e && e.message || '');
    const why = (LAST_OK ? '마지막으로 불러온 시각 ' + mdhm(LAST_OK) + ' · ' : '')
      + '오류 ' + (code ? code[1] : (e && e.message) || '알 수 없음');
    if (DATA) {
      // a poll that fails (a deploy's 502) keeps what is on screen and says so
      const pe = document.getElementById('poll-err');
      pe.textContent = '새로 불러오지 못했어요 · ' + why;
      pe.hidden = false;
      return;
    }
    document.getElementById('err-meta').textContent = why;
    show('error');
    return;
  }
  document.getElementById('poll-err').hidden = true;
  DATA = d;
  LAST_OK = new Date().toISOString();
  THEME_NAME = {};
  d.news.themes.forEach(t => { if (t.name_kr) THEME_NAME[t.theme_id] = t.name_kr; });
  const items = checkItems(d);
  renderHead(d, items);
  renderCheck(d, items);
  renderSide(d);
  renderSources(d);
  show('data');
  syncSide();
  if (OPEN) {
    const inside = dp.body.contains(document.activeElement);
    renderPanel();
    if (inside) { const c = dp.el.querySelector('.s-panel-head .btn:not(.sm-down)'); if (c) c.focus(); }
  }
}
document.getElementById('btn-reload').addEventListener('click', load);
document.getElementById('btn-retry').addEventListener('click', () => { show('loading'); load(); });
show('loading');
load();
S.whenVisible(load, POLL_MS);
</script>
