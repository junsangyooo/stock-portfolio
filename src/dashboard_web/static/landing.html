<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>portfolio-dashboard · 홈</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap');
/* Color tokens injected by server from static/theme.json. */
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:var(--bg); color:var(--fg);
  font-family:'JetBrains Mono', monospace;
  font-size:12px; line-height:1.45; min-height:100vh; padding:8px;
  background-image:
    linear-gradient(rgba(var(--grid-rgb), 0.4) 1px, transparent 1px),
    linear-gradient(90deg, rgba(var(--grid-rgb), 0.4) 1px, transparent 1px);
  background-size:24px 24px;
}
a { color:inherit; text-decoration:none; }

/* ── TOPBAR (sticky) ──────────────────────────────────────── */
.topbar-wrap {
  position:sticky; top:0; z-index:50;
  background:var(--bg);
  margin:-8px -8px 8px;
  padding:8px 8px 0;
  border-bottom:1px solid var(--line);
}
.header {
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 12px; background:var(--panel);
  border:var(--border-w) solid var(--line);
  border-radius:var(--radius-md) var(--radius-md) 0 0;
  box-shadow:var(--shadow-sm);
  margin-bottom:0;
}
.header .left { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.header .title { color:var(--fg); font-weight:700; letter-spacing:2px; }
.header .clock { color:var(--cyan); font-family:'Press Start 2P'; font-size:16px; }
#account-tabs { display:flex; gap:6px; flex-wrap:wrap; }

.pill {
  padding:2px 10px; border:1px solid var(--cyan);
  border-radius:var(--radius-sm); color:var(--cyan);
  font-size:10px; letter-spacing:1px; cursor:pointer;
  text-decoration:none; font-family:inherit;
  background:transparent;
}
.pill.dashed { border-style:dashed; }

/* CATEGORY chip bar */
.cat-bar {
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
  padding:8px 12px; background:var(--panel);
  border:var(--border-w) solid var(--line); border-top:none;
  border-radius:0 0 var(--radius-md) var(--radius-md);
  box-shadow:var(--shadow-sm);
  margin-bottom:8px;
}
.cat-bar .cat-label {
  font-size:10px; letter-spacing:2px; color:var(--dim);
  margin-right:8px; text-transform:uppercase;
}
.chip {
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px; border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  color:var(--dim); font-size:11px; cursor:pointer;
  background:transparent; font-family:inherit;
  transition:background 0.1s, color 0.1s, border-color 0.1s;
}
.chip:hover { color:var(--fg); border-color:var(--dim); }
.chip.on {
  background:rgba(var(--cyan-rgb), 0.15); color:var(--cyan);
  border-color:var(--cyan);
}
.chip.reset {
  color:var(--muted); margin-left:auto;
  border-style:dashed;
}

/* ── MAIN GRID (news + social) ──────────────────────────── */
.main-grid {
  display:grid; grid-template-columns: 2fr 1fr; gap:8px;
}
@media (max-width: 900px) { .main-grid { grid-template-columns:1fr; } }

.panel {
  background:var(--panel); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-md); box-shadow:var(--shadow-sm);
  padding:14px 16px;
}
.panel-title {
  font-size:10px; letter-spacing:2px; color:var(--dim);
  margin-bottom:12px; text-transform:uppercase;
  display:flex; justify-content:space-between; align-items:center;
}
.panel-title .tag { color:var(--cyan); font-size:10px; }

/* NEWS GRID */
.news-grid {
  display:grid; grid-template-columns:repeat(2, 1fr); gap:8px;
}
@media (max-width: 600px) { .news-grid { grid-template-columns:1fr; } }
.news-card {
  border:1px solid var(--line); border-radius:var(--radius-md);
  padding:0; overflow:hidden;
  cursor:pointer; background:var(--elevated);
  box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column;
  transition:border-color 0.12s, transform 0.12s, box-shadow 0.12s;
}
.news-card:hover {
  border-color:var(--cyan); transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}
.news-thumb {
  height:120px; background:linear-gradient(135deg,
    rgba(var(--cyan-rgb), 0.10),
    rgba(var(--purple-rgb), 0.10));
  position:relative; display:flex; align-items:center; justify-content:center;
}
.news-thumb .tag {
  position:absolute; top:8px; left:8px; z-index:2;
  background:rgba(var(--bg-rgb), 0.8);
  color:var(--cyan); border:1px solid var(--cyan);
  font-size:9px; padding:1px 6px; letter-spacing:1px;
}
.news-thumb .imp {
  position:absolute; top:8px; right:8px; z-index:2;
  background:rgba(var(--bg-rgb), 0.8);
  color:var(--yellow); font-size:9px; padding:1px 5px;
  border:1px solid var(--yellow); letter-spacing:1px;
}
.news-thumb .thumb-img {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
}
.news-thumb .placeholder-ico { font-size:32px; opacity:0.3; }
.lci { width:1.05em; height:1.05em; vertical-align:-0.18em; flex:none; }
.news-thumb .fav-img { width:34px; height:34px; opacity:0.9; }
.news-body { padding:10px 12px; }
.news-title {
  font-size:12px; font-weight:700; color:var(--fg);
  margin-bottom:6px; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}
.news-sum {
  font-size:11px; color:var(--dim); line-height:1.4; margin-bottom:6px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}
.news-meta {
  font-size:10px; color:var(--dim); letter-spacing:0.5px;
  display:flex; justify-content:space-between; align-items:center; gap:6px;
}
.news-meta .src {
  color:var(--cyan); display:inline-flex; align-items:center; gap:4px;
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.news-meta .src-ico { width:14px; height:14px; border-radius:3px; flex:none; }
.news-meta .when { flex:none; }
.news-meta .imp-m { display:none; color:var(--yellow); flex:none; }

/* 오늘의 요약 — per-theme digest overviews, collapsible (state in localStorage) */
.today-sum {
  margin-bottom:12px; border:1px solid var(--line);
  border-radius:var(--radius-sm); background:var(--elevated);
}
.today-sum-head {
  display:flex; align-items:center; gap:8px; padding:8px 10px;
  cursor:pointer; user-select:none;
  font-size:10px; letter-spacing:2px; color:var(--cyan);
  text-transform:uppercase;
}
.today-sum-head:hover { color:var(--fg); }
.today-sum-head .caret { font-size:8px; transition:transform 0.12s; }
.today-sum-head .n { margin-left:auto; color:var(--dim); letter-spacing:1px; }
.today-sum.collapsed .caret { transform:rotate(-90deg); }
.today-sum.collapsed .today-sum-body { display:none; }
.today-sum-body {
  padding:0 10px 10px; display:flex; flex-direction:column; gap:9px;
}
.sum-theme { display:flex; gap:8px; align-items:flex-start; }
.sum-theme .lbl {
  flex:none; width:76px; margin-top:1px;
  font-size:9px; padding:2px 4px; text-align:center;
  border:1px solid; border-radius:2px; letter-spacing:0.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.sum-theme ul { margin:0; padding:0; list-style:none; min-width:0; }
.sum-theme li {
  position:relative; padding-left:11px;
  font-size:11px; color:var(--fg); line-height:1.55;
}
.sum-theme li::before {
  content:'·'; position:absolute; left:2px; color:var(--dim);
}

/* 오늘의 핵심 — digest-starred articles pinned above the grid */
.top-news { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.top-news-title {
  font-size:10px; letter-spacing:2px; color:var(--yellow);
  text-transform:uppercase;
}
.top-news-item {
  display:flex; align-items:center; gap:8px;
  border:1px solid rgba(var(--yellow-rgb), 0.45);
  background:rgba(var(--yellow-rgb), 0.06);
  border-radius:var(--radius-sm); padding:6px 10px;
  cursor:pointer; transition:border-color 0.1s, background 0.1s;
}
.top-news-item:hover {
  border-color:var(--yellow); background:rgba(var(--yellow-rgb), 0.12);
}
.top-news-item .stars { color:var(--yellow); font-size:10px; flex:none; }
.top-news-item .t {
  font-size:11px; font-weight:700; color:var(--fg);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
}
.top-news-item .m { color:var(--dim); font-size:10px; flex:none; margin-left:auto; }

/* SOCIAL LIST */
.social-list { display:flex; flex-direction:column; gap:8px; }
.social-item {
  border-left:2px solid var(--line); padding:8px 10px;
  background:var(--elevated);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  box-shadow:var(--shadow-sm);
  font-size:11px;
  transition:border-color 0.1s, box-shadow 0.1s;
}
.social-item:hover { border-left-color:var(--cyan); box-shadow:var(--shadow-md); }
.social-head {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:4px;
}
.social-author {
  font-weight:700; color:var(--cyan); font-size:11px;
  display:flex; align-items:center; gap:6px;
}
.social-author .avatar {
  width:18px; height:18px; border-radius:50%;
  background:linear-gradient(135deg, var(--cyan), var(--purple));
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--bg); font-size:9px; font-weight:700;
}
.social-time { color:var(--dim); font-size:10px; }
.social-text { color:var(--fg); line-height:1.4; }
.social-foot {
  margin-top:4px; color:var(--muted); font-size:10px;
  display:flex; gap:10px;
}

.footer { color:var(--muted); font-size:10px;
  margin-top:18px; text-align:center; padding:12px; }

/* ── MOBILE (<=640px) ─────────────────────────────────────
   Desktop keeps the card grid; phones get a dense scan list. The sticky
   chrome is the scarce resource here — the chip bar goes to one
   horizontally scrolling row and the header collapses to a single line. */
@media (max-width: 640px) {
  body { padding:4px; }
  .topbar-wrap { margin:-4px -4px 6px; padding:4px 4px 0; }

  .header { padding:6px 8px; gap:8px; }
  .header .left { gap:8px; }
  .header .title { font-size:10px; letter-spacing:1px; }
  .header .clock { font-size:11px; flex:none; }
  .pill { padding:5px 9px; font-size:9px; }

  .cat-bar {
    flex-wrap:nowrap; overflow-x:auto; padding:5px 8px; gap:5px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .cat-bar::-webkit-scrollbar { display:none; }
  .cat-bar .cat-label { display:none; }
  .chip { flex:none; min-height:32px; padding:6px 11px; }
  .chip.reset { margin-left:0; }

  .panel { padding:10px 10px; }

  /* 오늘의 요약 — stack the theme label above its bullets */
  .sum-theme { flex-direction:column; gap:3px; }
  .sum-theme .lbl { width:auto; align-self:flex-start; padding:2px 8px; }

  /* 오늘의 핵심 — let the headline wrap instead of truncating to nothing */
  .top-news-item { flex-wrap:wrap; padding:8px 10px; }
  .top-news-item .t {
    white-space:normal; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .top-news-item .m { margin-left:0; width:100%; }

  /* NEWS → scan list: ~6-8 rows per screen instead of 2 cards */
  .news-grid { gap:0; }
  .news-card {
    flex-direction:row; gap:10px; align-items:flex-start;
    padding:10px 4px 10px 8px;
    background:transparent; border:none; border-radius:0;
    border-left:2px solid var(--tc); border-bottom:1px solid var(--line);
    box-shadow:none;
  }
  .news-card:hover { transform:none; box-shadow:none; border-color:var(--line); }
  .news-thumb {
    width:56px; height:56px; flex:none;
    border-radius:var(--radius-sm); overflow:hidden;
  }
  .news-thumb.no-img { display:none; }   /* favicon/gradient carries no info */
  .news-thumb .tag, .news-thumb .imp { display:none; }
  .news-body { padding:0; flex:1; min-width:0; }
  .news-title { font-size:13px; -webkit-line-clamp:3; margin-bottom:4px; }
  .news-sum { margin-bottom:4px; }
  .news-meta .imp-m { display:inline; }

  .social-item { padding:10px; }
}
</style>
</head>

<script>
// ─────────────────────────────────────────────────────────
// helpers
// ─────────────────────────────────────────────────────────
const KST_OFFSET_MS = 9 * 3600 * 1000;
const pad = n => n < 10 ? '0'+n : ''+n;
function fmtClock() {
  const d = new Date(Date.now() + KST_OFFSET_MS);
  return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())+' KST';
}
const clockEl = document.getElementById('clock');
setInterval(() => { clockEl.textContent = fmtClock(); }, 1000);
clockEl.textContent = fmtClock();

function el(tag, props, children) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'className') e.className = props[k];
    else if (k === 'style') e.setAttribute('style', props[k]);
    else if (k === 'dataset') { for (const d in props[k]) e.dataset[d] = props[k][d]; }
    else if (k.startsWith('on') && typeof props[k] === 'function') {
      e.addEventListener(k.slice(2).toLowerCase(), props[k]);
    } else e.setAttribute(k, props[k]);
  }
  if (children) for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === 'string' || typeof c === 'number'
      ? document.createTextNode(String(c)) : c);
  }
  return e;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
// Lucide sprite instance — <svg class="lci"><use href="#i-name"/></svg>
function svgIco(name) {
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('class', 'lci');
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.appendChild(u);
  return s;
}

// ─────────────────────────────────────────────────────────
// account tabs (sticky topbar)
// ─────────────────────────────────────────────────────────
async function renderAccountTabs() {
  const tabsEl = document.getElementById('account-tabs');
  clear(tabsEl);
  try {
    const r = await fetch('/api/accounts');
    const d = await r.json();
    const accs = (d && d.accounts) || [];
    if (accs.length === 0) {
      tabsEl.appendChild(el('span',
        { style: 'color:var(--dim); font-size:10px; letter-spacing:1px;' },
        ['(계좌 없음 — ＋ 계좌 추가)']));
      return;
    }
    for (const a of accs) {
      // public list carries identity only (no assets); show a lock if PIN-gated
      const tab = el('a', {
        className: 'pill',
        href: '/a/' + encodeURIComponent(a.account_id),
        title: (a.broker || '') + ' · ' + (a.account_type || '') +
               (a.has_pin ? ' · 비밀번호 필요' : ''),
      }, a.has_pin ? [svgIco('lock'), ' ' + a.name] : [a.name]);
      tabsEl.appendChild(tab);
    }
  } catch (_) {
    tabsEl.appendChild(el('span',
      { style: 'color:var(--red); font-size:10px;' }, ['계좌 로드 실패']));
  }
}
renderAccountTabs();

// + 계좌 추가 — landing 페이지에서는 첫 계좌 페이지로 이동(모달은 account.html에 있음)
document.getElementById('btn-new-account').addEventListener('click', async () => {
  try {
    const r = await fetch('/api/accounts');
    const d = await r.json();
    const first = d.accounts && d.accounts[0];
    const goto = first ? first.account_id : 'junisa';
    location.href = '/a/' + encodeURIComponent(goto) + '?new=1';
  } catch {
    location.href = '/a/junisa?new=1';
  }
});

// ─────────────────────────────────────────────────────────
// qualitative feed (news + social) — from /api/analysis/news/feed
// Populated by the 06:00 daily_job collect step. Chips = our themes.
// ─────────────────────────────────────────────────────────
const FEED = { news: [], social: [], summary: [], themes: [] };
const activeCats = new Set();   // theme_id set
const THEME_ICO = {
  battery:'battery-charging', ai_sw:'bot', bio:'dna', semiconductor:'cpu',
  robotics:'biceps-flexed', space:'rocket', fintech:'landmark',
  shipbuilding:'ship', adv_manufacturing:'printer', macro:'globe',
};
// per-theme accent — badge / placeholder gradient / top-news chips
const THEME_COLOR = {
  battery:'#2E7D4F', ai_sw:'#6B4FA8', bio:'#0F766E', semiconductor:'#1D4ED8',
  robotics:'#B5446E', space:'#4C51BF', fintech:'#A97A0B', shipbuilding:'#1F6F78',
  adv_manufacturing:'#C1600F', macro:'#5B6472',
};
function themeColor(id) { return THEME_COLOR[id] || 'var(--cyan)'; }
function hexA(hex, a) {  // '#4ade80' + alpha -> rgba()
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
// source_id -> display name (feed ids are internal slugs)
const SRC_NAME = {
  electrek:'Electrek', electrek_ev:'Electrek',
  thelec_battery:'디일렉', thelec_semi:'디일렉', etnews_it:'전자신문',
  aitimes:'AI타임스', geeknews:'GeekNews', docdocdoc:'청년의사',
  statnews:'STAT News', biorxiv:'bioRxiv', semianalysis:'SemiAnalysis',
  robotreport:'Robot Report', irobotnews:'로봇신문',
  spacenews:'SpaceNews', payload:'Payload', finextra:'Finextra',
  hk_finance:'한국경제', mk_stock:'매일경제', einfomax:'연합인포맥스',
  gcaptain:'gCaptain', splash247:'Splash 247', '3dpi':'3D Printing Industry',
  fed_press:'Fed', bok_press:'한국은행',
  reddit_ml:'r/MachineLearning', reddit_semi:'r/semiconductors',
  reddit_robotics:'r/robotics',
};
function srcName(id) { return SRC_NAME[id] || id || ''; }
function timeAgo(iso) {
  if (!iso) return '';
  const t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return Math.floor(s / 86400) + '일 전';
}
// article publish time (published_iso) preferred; fetch time is the same for
// every card in a daily batch so it says nothing about recency
function itemTime(x) { return timeAgo(x.published_iso || x.fetched_at); }
function _filtered(arr) {
  if (activeCats.size === 0) return arr;
  return arr.filter(x =>
    (x.themes || [{ id: x.theme }]).some(t => activeCats.has(t.id)));
}

function renderCatBar() {
  const bar = document.getElementById('cat-bar');
  while (bar.children.length > 1) bar.removeChild(bar.lastChild);  // keep label
  for (const th of FEED.themes) {
    const on = activeCats.has(th.id);
    bar.appendChild(el('button', {
      className: 'chip' + (on ? ' on' : ''),
      onClick: () => {
        if (activeCats.has(th.id)) activeCats.delete(th.id);
        else activeCats.add(th.id);
        renderCatBar(); renderSummary(); renderNews(); renderSocial();
      },
    }, [svgIco(THEME_ICO[th.id] || 'newspaper'), th.name_kr]));
  }
  if (activeCats.size > 0) {
    bar.appendChild(el('button', {
      className: 'chip reset',
      onClick: () => { activeCats.clear(); renderCatBar(); renderSummary(); renderNews(); renderSocial(); },
    }, ['전체 해제']));
  }
}

function renderSummary() {
  // per-theme bullets written by the nightly digest LLM call (no extra cost);
  // follows the category chips so filtering the feed filters the summary too
  const box = document.getElementById('today-sum');
  clear(box);
  const rows = (FEED.summary || []).filter(
    s => activeCats.size === 0 || activeCats.has(s.theme));
  if (rows.length === 0) { box.style.display = 'none'; return; }
  box.style.display = '';
  const collapsed = localStorage.getItem('sumCollapsed') === '1';
  box.className = 'today-sum' + (collapsed ? ' collapsed' : '');
  const lines = rows.reduce((a, s) => a + (s.bullets || []).length, 0);
  // digests may lag a day (dawn batch); show the date so it never reads as today
  const date = rows.map(s => s.date || '').sort().pop() || '';
  box.appendChild(el('div', {
    className: 'today-sum-head',
    onClick: () => {
      const now = !box.classList.contains('collapsed');
      box.classList.toggle('collapsed', now);
      localStorage.setItem('sumCollapsed', now ? '1' : '0');
    },
  }, [
    el('span', { className:'caret' }, ['▼']),
    el('span', {}, ['오늘의 요약']),
    el('span', { className:'n' },
      [date.slice(5) + ' · ' + rows.length + '개 분야 · ' + lines + '줄']),
  ]));
  const body = el('div', { className:'today-sum-body' }, []);
  for (const s of rows) {
    const c = themeColor(s.theme);
    body.appendChild(el('div', { className:'sum-theme' }, [
      el('span', { className:'lbl', style:`color:${c}; border-color:${c};` },
        [s.theme_kr || s.theme]),
      el('ul', {}, (s.bullets || []).map(b => el('li', {}, [b]))),
    ]));
  }
  box.appendChild(body);
}

function renderTopNews(items) {
  // digest-starred (importance>=4) articles pinned above the grid
  const box = document.getElementById('top-news');
  clear(box);
  const top = items.filter(n => (n.importance || 0) >= 4)
    .sort((a, b) => (b.importance || 0) - (a.importance || 0))
    .slice(0, 6);
  if (top.length === 0) { box.style.display = 'none'; return; }
  box.style.display = '';
  box.appendChild(el('div', { className:'top-news-title' }, ['★ 오늘의 핵심']));
  for (const n of top) {
    const c = themeColor(n.theme);
    box.appendChild(el('div', {
      className: 'top-news-item',
      onClick: n.url ? () => window.open(n.url, '_blank', 'noopener') : null,
    }, [
      el('span', { className:'stars' }, ['★'.repeat(Math.min(5, n.importance || 0))]),
      el('span', {
        style: `flex:none; font-size:9px; padding:0 5px; border:1px solid ${c}; color:${c}; letter-spacing:1px;`,
      }, [(n.themes || []).map(t => t.kr).join('·') || n.theme_kr || '']),
      el('span', { className:'t' }, [n.title || '']),
      el('span', { className:'m' }, [srcName(n.source) + ' · ' + itemTime(n)]),
    ]));
  }
}

function renderNews() {
  const grid = document.getElementById('news-grid');
  const cnt = document.getElementById('news-count');
  clear(grid);
  const items = _filtered(FEED.news);
  cnt.textContent = items.length + ' 건';
  renderTopNews(items);
  if (items.length === 0) {
    grid.appendChild(el('div', {
      style: 'color:var(--dim); font-size:11px; grid-column:1/-1; padding:18px; text-align:center;',
    }, ['수집된 뉴스 없음 (매일 06:00 자동 수집)']));
    return;
  }
  for (const n of items) {
    const c = themeColor(n.theme);
    // thumbnail: media/og image (A/B) → source favicon (C) → theme emoji (D)
    const ico = THEME_ICO[n.theme] || 'newspaper';
    const fallback = el('span', { className:'placeholder-ico' },
      n.favicon
        ? [el('img', { className:'fav-img', src:n.favicon, alt:'',
            onError: function () { this.replaceWith(svgIco(ico)); } })]
        : [svgIco(ico)]);
    const badge = (n.themes || []).map(t => t.kr).join('·') || n.theme_kr || '';
    const thumbKids = [el('span', {
      className:'tag', style:`color:${c}; border-color:${c};`,
    }, [badge])];
    if ((n.importance || 0) >= 4) {
      thumbKids.push(el('span', { className:'imp' },
        ['★'.repeat(Math.min(5, n.importance))]));
    }
    if (n.image) {
      const img = el('img', { className:'thumb-img', src:n.image, loading:'lazy', alt:'',
        onError: function () { this.remove(); fallback.style.setProperty('display', ''); } });
      fallback.style.setProperty('display', 'none');
      thumbKids.push(img, fallback);
    } else {
      thumbKids.push(fallback);
    }
    const card = el('div', {
      className: 'news-card',
      style: `--tc:${c};` + (n.url ? ' cursor:pointer;' : ''),
      onClick: n.url ? () => window.open(n.url, '_blank', 'noopener') : null,
    }, [
      el('div', {
        // no-img thumbs carry no information — mobile drops them entirely
        className:'news-thumb' + (n.image ? '' : ' no-img'),
        style:`background:linear-gradient(135deg, ${hexA(THEME_COLOR[n.theme] || '#22d3ee', 0.16)}, ${hexA(THEME_COLOR[n.theme] || '#a78bfa', 0.05)});`,
      }, thumbKids),
      el('div', { className:'news-body' }, [
        el('div', { className:'news-title' }, [n.title || '']),
        // one-liner from the nightly digest (only starred items have one)
        n.gist ? el('div', { className:'news-sum' }, [n.gist]) : null,
        el('div', { className:'news-meta' }, [
          el('span', { className:'src' }, [
            n.favicon ? el('img', { className:'src-ico', src:n.favicon, alt:'',
              onError: function () { this.remove(); } }) : null,
            srcName(n.source),
          ]),
          el('span', { className:'when' }, [itemTime(n)]),
          // mobile drops the thumb overlay, so stars move into the meta row
          (n.importance || 0) >= 4
            ? el('span', { className:'imp-m' },
                ['★'.repeat(Math.min(5, n.importance))]) : null,
        ]),
      ]),
    ]);
    grid.appendChild(card);
  }
}

function renderSocial() {
  const list = document.getElementById('social-list');
  const cnt = document.getElementById('social-count');
  clear(list);
  const items = _filtered(FEED.social);
  cnt.textContent = items.length + ' 건';
  if (items.length === 0) {
    list.appendChild(el('div', {
      style: 'color:var(--dim); font-size:11px; padding:14px; text-align:center;',
    }, ['수집된 소셜 없음']));
    return;
  }
  for (const s of items) {
    const item = el('div', {
      className: 'social-item',
      style: s.url ? 'cursor:pointer;' : null,
      onClick: s.url ? () => window.open(s.url, '_blank', 'noopener') : null,
    }, [
      el('div', { className:'social-head' }, [
        el('span', { className:'social-author' }, [
          el('span', { className:'avatar' }, [(s.source || '?').slice(0, 1).toUpperCase()]),
          '@' + (s.source || ''),
        ]),
        el('span', { className:'social-time' }, [itemTime(s)]),
      ]),
      el('div', { className:'social-text' }, [s.title || '']),
      el('div', { className:'social-foot' }, [ el('span', {}, ['#' + (s.theme_kr || '')]) ]),
    ]);
    list.appendChild(item);
  }
}

async function loadFeed() {
  try {
    const r = await fetch('/api/analysis/news/feed?limit=80');
    const d = await r.json();
    FEED.news = d.news || [];
    FEED.social = d.social || [];
    FEED.summary = d.summary || [];
    FEED.themes = d.themes || [];
  } catch (e) {
    FEED.news = []; FEED.social = []; FEED.summary = []; FEED.themes = [];
  }
  renderCatBar(); renderSummary(); renderNews(); renderSocial();
}
loadFeed();
</script>
